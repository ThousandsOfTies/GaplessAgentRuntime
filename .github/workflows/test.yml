name: Tests

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  lint:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install ruff
        run: pip install ruff==0.6.9

      - name: Run ruff
        run: |
          ruff check scripts scripts/gar_lib/build tests tools/*.py tools/gar-mcp/server.py
          ruff format --check scripts scripts/gar_lib/build tests tools/*.py tools/gar-mcp/server.py

      - name: Check shell and VS Code extension syntax
        run: |
          bash -n tools/forward_sim_ports.sh tools/forward_ec2_ports.sh tools/setup_codespace_wsl.sh scripts/create-product-devspace.sh
          node --check tools/vscode-gar/extension.js
          node --test tools/vscode-gar/*.test.js

  unittest:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install GAR runtime dependencies
        run: python -m pip install -r requirements-gar.txt

      - name: Run unittest
        run: python -m unittest discover -s tests -v

  windows-smoke:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install GAR runtime dependencies
        run: python -m pip install -r requirements-gar.txt

      - name: Import CLI and render Windows command help
        shell: pwsh
        run: |
          python -m scripts.gar_lib --help
          if ($LASTEXITCODE -ne 0) { throw "CLI help failed" }
          python -m scripts.gar_lib target --help
          if ($LASTEXITCODE -ne 0) { throw "Target help failed" }
          cmd /c scripts\setup.cmd
          if ($LASTEXITCODE -ne 0) { throw "Windows setup smoke failed" }
          cmd /c scripts\gar.cmd --help
          if ($LASTEXITCODE -ne 0) { throw "Windows launcher help failed" }
          $completionScript = (& .\scripts\gar.cmd completion powershell --command "$PWD\scripts\gar.cmd") | Out-String
          if ($LASTEXITCODE -ne 0) { throw "PowerShell completion generation failed" }
          Invoke-Expression $completionScript
          $completionCandidates = (TabExpansion2 "gar sim " 8).CompletionMatches.CompletionText
          if ($completionCandidates -notcontains "start") {
            throw "PowerShell completion did not return gar sim start"
          }
          $subjectCandidates = (TabExpansion2 "gar sim start " 14).CompletionMatches.CompletionText
          if ($subjectCandidates -notcontains "host") {
            throw "PowerShell completion did not return gar sim start host"
          }

      - name: Run all Windows unit tests including command reference checks
        run: python -m unittest discover -s tests -v
